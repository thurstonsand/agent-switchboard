name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mise builds tmux 3.8 from source.
      - run: sudo apt-get install -y --no-install-recommends libevent-dev libncurses-dev bison
      # Codex's sandbox runs commands in bwrap, which Ubuntu's AppArmor leaves no capabilities in a new user namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: mise run check
      - run: mise run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts
