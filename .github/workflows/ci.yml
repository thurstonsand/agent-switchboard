name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Not `github.workflow`: when release.yml calls this workflow, that names the caller, whose group
# would then wait on itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SWB_E2E_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Codex's sandbox runs commands in bwrap, which Ubuntu's AppArmor leaves no capabilities in a new user namespace.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: bun install --frozen-lockfile
      - if: matrix.shard == 1
        run: mise run check
      - run: mise run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: test/e2e/artifacts

  check:
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.tests.result }}
