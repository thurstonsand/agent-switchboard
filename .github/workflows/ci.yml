name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - run: npm install -g @earendil-works/pi-coding-agent@1.0.4 pi-sessions@0.14.1 @thurstonsand/pi-wt@1.15.0
      - run: |
          echo "SWB_E2E_PI_SESSIONS=$(npm root -g)/pi-sessions" >> "$GITHUB_ENV"
          echo "SWB_E2E_PI_WT=$(npm root -g)/@thurstonsand/pi-wt" >> "$GITHUB_ENV"
      - run: mise run check
      - run: mise run e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-artifacts
          path: test/e2e/artifacts
