[tools]
bun = "1.4.4"
node = "24"
"aqua:biomejs/biome" = "2.6.3"
# tmux-builds has no 3.8 yet; this builds it from its release tarball, with libevent and ncurses headers.
"asdf:mise-plugins/mise-tmux" = "3.8"
"aqua:charmbracelet/vhs" = "0.12.1"
"conda:ttyd" = "1.7.7"
"conda:ffmpeg" = "9.0.2"
"github:thurstonsand/wt" = "1.16.0"
"aqua:neovim/neovim" = "0.12.6"

[tasks.bootstrap]
run = "bun install --frozen-lockfile"

[tasks.lint]
run = "biome check ."

[tasks.fix]
run = "biome check --write ."

[tasks.typecheck]
run = "bun x tsc -p tsconfig.json --noEmit"

[tasks.build]
description = "Compile swb into dist/swb"
run = "bun build --compile --minify --splitting --sourcemap --bytecode --format=esm packages/cli/src/main.ts packages/cli/src/deck/worker.ts --outfile dist/swb"

[tasks."dist:pi"]
description = "Bundle the pi line exactly as the release publishes it"
run = [
  "rm -rf dist/pi && mkdir -p dist/pi",
  "bun build packages/lines/pi/src/index.ts --target=node --format=esm --outfile dist/pi/index.js --external '@earendil-works/*' --external typebox",
  "! grep -q 'Bun\\.' dist/pi/index.js || (echo 'dist:pi: bundle references Bun.' >&2; exit 1)",
  "bun scripts/dist-pi-package.ts",
]

[tasks."release:build"]
description = "Build every release artifact into OUT: a swb binary per target, and the pi bundle packed for npm"
depends = ["dist:pi"]
usage = 'arg "<out>"'
run = """
set -eu
out="$usage_out"
mkdir -p "$out"
for target in linux-x64 darwin-arm64; do
  bun build --compile --minify --splitting --sourcemap --bytecode --format=esm --target="bun-$target" packages/cli/src/main.ts packages/cli/src/deck/worker.ts --outfile "$out/swb-$target"
done
cp -R dist/pi "$out/pi"
npm pack ./dist/pi --pack-destination "$out"
"""

[tasks."release:check"]
description = "Build every release artifact into a scratch dir and smoke-test this host's binary"
run = """
set -eu
out="$(mktemp -d)"
trap 'rm -rf "$out"' EXIT
mise run release:build "$out"
case "$(uname -s)-$(uname -m)" in
  Linux-x86_64) host=linux-x64 ;;
  Darwin-arm64) host=darwin-arm64 ;;
  *) echo "release:check: no release target for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
"$out/swb-$host" --version
tar -tzf "$out"/thurstonsand-pi-agent-switchboard-*.tgz
ls -l "$out"
"""

[tasks.readme]
description = "Regenerate README.md's settings block from the settings registry"
run = "bun scripts/settings-readme.ts"

[tasks."readme:check"]
run = "bun scripts/settings-readme.ts --check"

[tasks.check]
description = "Full verification gate"
depends = ["lint", "typecheck", "build", "dist:pi", "readme:check"]

[tasks.install]
description = "Build swb from this checkout into ~/.local/bin"
run = [
  "bun build --compile --minify --splitting --sourcemap --bytecode --format=esm --define SWB_INSTALL_VERSION=\\\"$(git describe --tags --match 'v*' | sed 's/^v//')\\\" packages/cli/src/main.ts packages/cli/src/deck/worker.ts --outfile dist/swb",
  "install -m 0755 dist/swb ~/.local/bin/swb",
]

[tasks.e2e]
description = "Real pi in private tmux servers, scripted by the faux provider"
depends = ["build", "dist:pi"]
run = """
if [ -n "${CI:-}" ]; then
  bun test --timeout 180000 --max-concurrency 1 test/e2e
else
  # deck-latency times keystrokes in milliseconds, so it runs alone, after the rest; a failure in either still fails the run.
  status=0
  bun test --timeout 180000 --parallel=$(( $(getconf _NPROCESSORS_ONLN) * 2 )) --path-ignore-patterns='**/deck-latency.test.ts' test/e2e || status=$?
  bun test --timeout 180000 test/e2e/deck-latency.test.ts || status=$?
  exit $status
fi
"""

[tasks.evidence]
description = "Render every VHS tape"
depends = ["build", "dist:pi"]
run = "bun test/e2e/tapes/render.ts"

[tasks.perf]
description = "Measure what a person waits for in swb, on real harnesses; `mise run perf -- --help` for options"
depends = ["build", "dist:pi"]
run = "bun test/perf/run.ts"

[tasks."perf:compare"]
description = "Compare two perf results files"
run = "bun test/perf/run.ts compare"
